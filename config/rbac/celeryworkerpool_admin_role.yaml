# This rule is not used by the project celery-scale-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over scaling.hytech-imaging.fr.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: celery-scale-operator
    app.kubernetes.io/managed-by: kustomize
  name: celeryworkerpool-admin-role
rules:
- apiGroups:
  - scaling.hytech-imaging.fr
  resources:
  - celeryworkerpools
  verbs:
  - '*'
- apiGroups:
  - scaling.hytech-imaging.fr
  resources:
  - celeryworkerpools/status
  verbs:
  - get
