apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "celery-scale-operator-chart.fullname" . }}-manager-role
  labels:
  {{- include "celery-scale-operator-chart.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
- apiGroups:
  - scaling.hytech-imaging.fr
  resources:
  - celeryworkerpools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - scaling.hytech-imaging.fr
  resources:
  - celeryworkerpools/finalizers
  verbs:
  - update
- apiGroups:
  - scaling.hytech-imaging.fr
  resources:
  - celeryworkerpools/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "celery-scale-operator-chart.fullname" . }}-manager-rolebinding
  labels:
  {{- include "celery-scale-operator-chart.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: '{{ include "celery-scale-operator-chart.fullname" . }}-manager-role'
subjects:
- kind: ServiceAccount
  name: '{{ include "celery-scale-operator-chart.serviceAccountName" . }}'
  namespace: '{{ .Release.Namespace }}'
