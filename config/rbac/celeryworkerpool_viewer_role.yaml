# This rule is not used by the project celery-scale-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to scaling.hytech-imaging.fr resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: celery-scale-operator
    app.kubernetes.io/managed-by: kustomize
  name: celeryworkerpool-viewer-role
rules:
- apiGroups:
  - scaling.hytech-imaging.fr
  resources:
  - celeryworkerpools
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - scaling.hytech-imaging.fr
  resources:
  - celeryworkerpools/status
  verbs:
  - get
